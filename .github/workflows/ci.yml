name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: rsutcliffe/ci-templates/.github/workflows/ci-next-basic.yml@v6
    with:
      package-manager: npm
      node-version: "22"
      type-check-command: "npx tsc --noEmit"
      test-command: "npm test -- --ci --forceExit"
      run-playwright: false
